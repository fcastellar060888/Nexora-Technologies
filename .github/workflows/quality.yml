name: Quality

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - foundation/event-bus-core
      - audit/**
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci --no-fund

      - name: Static audit
        run: npm run audit:static

      - name: Dependency audit
        run: npm run audit:deps

      - name: Environment contract audit
        run: npm run audit:env

      - name: Authentication and session audit
        run: npm run audit:auth

      - name: Functional tests
        run: npm test

      - name: Coverage gate
        run: npm run test:coverage

      - name: Production build
        run: npm run build:production

      - name: Production artifact audit
        run: npm run audit:build
