name: AUD-F059 Generate Lockfile

on:
  pull_request:
    branches:
      - foundation/event-bus-core

permissions:
  contents: write

concurrency:
  group: aud-f059-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Generate complete npm lockfile
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Verify reproducible clean install
        run: npm ci --no-audit --no-fund

      - name: Run full Quality gate
        run: npm run check

      - name: Commit certified lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already certified and up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(audit): add reproducible npm lockfile"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload certified lockfile
        uses: actions/upload-artifact@v6
        with:
          name: aud-f059-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
