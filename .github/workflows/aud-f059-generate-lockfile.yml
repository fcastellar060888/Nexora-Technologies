name: AUD-F059 Generate Lockfile

on:
  pull_request:
    branches:
      - foundation/event-bus-core

permissions:
  contents: read

concurrency:
  group: aud-f059-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Generate complete npm lockfile
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Verify reproducible clean install
        run: npm ci --no-audit --no-fund

      - name: Run full Quality gate
        run: npm run check

      - name: Upload certified lockfile
        uses: actions/upload-artifact@v6
        with:
          name: aud-f059-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
