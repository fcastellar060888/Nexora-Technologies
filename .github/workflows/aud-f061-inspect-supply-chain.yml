name: AUD-F061 Supply Chain Certification

on:
  push:
    branches:
      - audit/aud-f061-supply-chain-policy
    paths-ignore:
      - package-lock.json

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Regenerate lock metadata from pinned manifest
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Clean install under strict install-script policy
        run: npm ci
      - name: Verify no unreviewed install scripts remain
        run: npm approve-scripts --allow-scripts-pending
      - name: High severity dependency gate
        run: npm audit --audit-level=high
      - name: Full Quality gate
        run: npm run check
      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already matches pinned manifest"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(audit): align lockfile with pinned dependencies"
          git push
