name: AUD-F061 Inspect Supply Chain

on:
  pull_request:
    branches:
      - foundation/event-bus-core

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Regenerate lock metadata from pinned manifest
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Clean install
        run: npm ci
      - name: Direct dependency versions
        run: npm ls --depth=0
      - name: Pending install scripts
        run: npm approve-scripts --allow-scripts-pending
      - name: High severity dependency gate
        run: npm audit --audit-level=high
      - name: Full Quality gate
        run: npm run check
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v6
        with:
          name: aud-f061-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
